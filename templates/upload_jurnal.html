<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendeteksi Plagiarisme</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/upload.css">
</head>
{% include "sidebar.html" %}
<body class="fade-in">
  <div class="container">
    {% if message %}c:\Users\yoga\Downloads\ground_truth_1000.json
      <div class="message {% if 'Gagal' in message %}error{% endif %}">
        {{ message }}
      </div>
    {% endif %}
    <h2>Upload Jurnal Referensi Realtime</h2>
    <form id="plagiarismForm" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
      <label for="nama_jurnal">Nama Jurnal:</label>
      <input type="text" id="nama_jurnal" name="nama_jurnal" required>
      <input type="file" id="file" name="file" accept=".pdf" required>
      <button class="btn-upload" type="submit">Unggah Jurnal</button>
    </form>
  </div>
  {% include "span.html" %}
  <script>
    document.querySelectorAll('a[href]').forEach(link => {
  const url = link.getAttribute('href');
  if (url.startsWith('#') || url.startsWith('javascript:')) return;

  link.addEventListener('click', function (e) {
    e.preventDefault();
    document.body.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = this.href;
    }, 400); // sesuai durasi transisi
  });
});
  </script>
</body>
</html>
